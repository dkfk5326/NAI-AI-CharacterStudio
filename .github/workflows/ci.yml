name: Tests / 테스트
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAI_MODE: mock
      NAI_DATA_DIR: ${{ runner.temp }}/nai-studio-test-data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.lock
      - name: Install frontend / 프런트엔드 설치
        run: npm --prefix frontend ci
      - name: Build frontend / 프런트엔드 빌드
        run: npm --prefix frontend run build
      - name: Test frontend / 프런트엔드 테스트
        run: npm --prefix frontend test
      - name: Install Python dependencies / Python 의존성 설치
        run: python -m pip install -r requirements-test.lock
      - name: Test backend / 백엔드 테스트
        run: python -m unittest discover -s tests
